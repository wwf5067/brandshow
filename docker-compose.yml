version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: brandshow_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-brandshow}
      POSTGRES_USER: ${POSTGRES_USER:-brandshow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brandshow123}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - brandshow_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brandshow}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: brandshow_backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-brandshow}:${POSTGRES_PASSWORD:-brandshow123}@postgres:5432/${POSTGRES_DB:-brandshow}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - brandshow_net
    restart: unless-stopped
    command: >
      sh -c "cd /app && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: brandshow_frontend
    networks:
      - brandshow_net
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: brandshow_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - brandshow_net
    restart: unless-stopped

volumes:
  pg_data:

networks:
  brandshow_net:
    driver: bridge
