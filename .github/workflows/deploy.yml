# 推 main 时自动部署到腾讯云 Lighthouse
#
# 流程:
#   1) 构建前端静态产物 (Vue3 Vite)
#   2) 构建后端 Docker 镜像推到 GHCR
#   3) SSH 到 Lighthouse 执行远程部署
#
# 复用 newsfeed 的同一台 Lighthouse 服务器，brandshow 使用 8090 端口
# 数据库复用 newsfeed-pg 容器 (加入 newsfeed_default 网络)
#
# 必需的 GitHub Secrets (与 newsfeed 共用同一组):
#   SSH_HOST / SSH_USER / SSH_PORT / SSH_KEY
#   GHCR_TOKEN (或使用 GITHUB_TOKEN)

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Pack static dist
        run: tar -czf web-dist.tar.gz -C frontend/dist .

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web-dist.tar.gz
          retention-days: 7

  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image owner
        id: owner
        run: echo "lc=${IMAGE_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Compute image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.lc }}/brandshow-backend:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.lc }}/brandshow-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

  deploy:
    needs: [build-frontend, build-backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: web-dist

      - name: Set lowercase image owner
        id: owner
        run: echo "lc=${IMAGE_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Compute image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Prepare deploy bundle
        run: |
          mkdir -p bundle
          cp deploy/docker-compose.prod.yml bundle/
          cp deploy/nginx.conf bundle/
          cp web-dist.tar.gz bundle/
          tar -czf bundle.tar.gz -C bundle .

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.SSH_PORT || 22 }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Upload bundle
        run: |
          scp -P ${{ secrets.SSH_PORT || 22 }} bundle.tar.gz \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/brandshow-bundle.tar.gz

      - name: Render remote deploy script
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
          OWNER: ${{ steps.owner.outputs.lc }}
        run: |
          cat > deploy-remote.sh <<'EOS'
          #!/usr/bin/env bash
          set -euo pipefail

          : "${IMAGE_TAG:?IMAGE_TAG required}"
          : "${OWNER:?OWNER required}"

          APP_DIR=/opt/brandshow
          sudo mkdir -p "$APP_DIR"
          sudo chown "$USER":"$USER" "$APP_DIR"

          # 解压部署包
          tar -xzf /tmp/brandshow-bundle.tar.gz -C "$APP_DIR"
          rm -f /tmp/brandshow-bundle.tar.gz

          # 解压前端静态产物
          mkdir -p "$APP_DIR/web-dist" "$APP_DIR/web-dist-staging"
          rm -rf "$APP_DIR/web-dist-staging"/*
          tar -xzf "$APP_DIR/web-dist.tar.gz" -C "$APP_DIR/web-dist-staging"
          rm -f "$APP_DIR/web-dist.tar.gz"
          rsync -a --delete "$APP_DIR/web-dist-staging/" "$APP_DIR/web-dist/"
          rm -rf "$APP_DIR/web-dist-staging"

          cd "$APP_DIR"

          if [ ! -f .env ]; then
            echo "ERROR: $APP_DIR/.env missing. Run deploy/bootstrap.sh first." >&2
            exit 1
          fi

          # upsert: 有则替换，无则追加
          upsert_env() {
            local key="$1" val="$2"
            if grep -q "^${key}=" .env; then
              sed -i "s|^${key}=.*|${key}=${val}|" .env
            else
              echo "${key}=${val}" >> .env
            fi
          }
          upsert_env BACKEND_IMAGE "ghcr.io/${OWNER}/brandshow-backend:${IMAGE_TAG}"

          # 拉取最新镜像
          docker compose -f docker-compose.prod.yml --progress plain pull

          # 运行数据库迁移
          docker compose -f docker-compose.prod.yml --progress plain run --rm migrate

          # 启动/更新服务
          docker compose -f docker-compose.prod.yml --progress plain up -d
          docker compose -f docker-compose.prod.yml --progress plain up -d \
            --force-recreate --no-deps backend

          docker compose -f docker-compose.prod.yml ps

          # ---- 自检 ----
          echo "==> Verifying deployment..."
          for i in $(seq 1 15); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 3 \
              http://127.0.0.1:8090/health || echo "000")
            if [ "$code" = "200" ]; then
              echo "==> Healthcheck passed on attempt $i (HTTP $code)"
              break
            fi
            if [ "$i" = "15" ]; then
              echo "ERROR: healthcheck failed after 15 attempts (last: $code)" >&2
              docker compose -f docker-compose.prod.yml logs --tail 30 backend >&2 || true
              exit 1
            fi
            sleep 2
          done
          echo "==> Deployment verified: image=${IMAGE_TAG}, health=200"
          EOS
          chmod +x deploy-remote.sh

      - name: Upload deploy script
        run: |
          scp -P ${{ secrets.SSH_PORT || 22 }} deploy-remote.sh \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/brandshow-deploy.sh

      - name: Run deploy script on host
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
          OWNER: ${{ steps.owner.outputs.lc }}
        run: |
          ssh -tt \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -p ${{ secrets.SSH_PORT || 22 }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "IMAGE_TAG='${IMAGE_TAG}' OWNER='${OWNER}' bash /tmp/brandshow-deploy.sh && rm -f /tmp/brandshow-deploy.sh"
