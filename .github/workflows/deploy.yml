# 推 main 时自动部署到腾讯云 Lighthouse
#
# 加速方案：不传镜像 tar，只传代码（几十KB），服务器本地 build
# - 前端 build 产物 ~2MB（压缩）
# - 后端代码 ~50KB（只传 app/ 目录）
# - 服务器 Docker layer cache：依赖不变时 build <30s
#
# 必需 Secrets: SSH_HOST / SSH_USER / SSH_PORT / SSH_KEY

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  # ── 检测变化 ──────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      nginx: ${{ steps.filter.outputs.nginx }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'
            nginx:
              - 'deploy/nginx.conf'

  # ── 构建前端（只在有变化时）────────────────────────────────
  build-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Pack dist
        run: tar -czf web-dist.tar.gz -C frontend/dist .
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web-dist.tar.gz
          retention-days: 3

  # ── 部署 ──────────────────────────────────────────────────
  deploy:
    needs: [changes, build-frontend]
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 下载前端产物（如果本次有构建）
      - name: Download frontend dist
        if: needs.changes.outputs.frontend == 'true' && needs.build-frontend.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: web-dist

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.SSH_PORT || 22 }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      # 只在前端变化时上传 dist（~2MB）
      - name: Upload frontend dist
        if: needs.changes.outputs.frontend == 'true'
        run: |
          scp -P ${{ secrets.SSH_PORT || 22 }} web-dist.tar.gz \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/web-dist.tar.gz

      # 只在后端变化时上传代码（~50KB）
      - name: Upload backend code
        if: needs.changes.outputs.backend == 'true'
        run: |
          tar -czf backend-code.tar.gz backend/
          scp -P ${{ secrets.SSH_PORT || 22 }} backend-code.tar.gz \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/backend-code.tar.gz

      # 只在 nginx 变化时上传配置（几KB）
      - name: Upload nginx config
        if: needs.changes.outputs.nginx == 'true'
        run: |
          scp -P ${{ secrets.SSH_PORT || 22 }} deploy/nginx.conf \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/nginx.conf

      - name: Deploy on server
        env:
          BACKEND_CHANGED: ${{ needs.changes.outputs.backend }}
          FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend }}
          NGINX_CHANGED: ${{ needs.changes.outputs.nginx }}
        run: |
          ssh -tt \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -p ${{ secrets.SSH_PORT || 22 }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "BACKEND_CHANGED='${BACKEND_CHANGED}' FRONTEND_CHANGED='${FRONTEND_CHANGED}' NGINX_CHANGED='${NGINX_CHANGED}' bash -s" << 'REMOTE'
            set -euo pipefail
            APP_DIR=/opt/brandshow

            echo "backend=${BACKEND_CHANGED} frontend=${FRONTEND_CHANGED} nginx=${NGINX_CHANGED}"

            # ── 前端 ──
            if [ "${FRONTEND_CHANGED}" = "true" ] && [ -f /tmp/web-dist.tar.gz ]; then
              echo "==> Updating frontend..."
              mkdir -p "$APP_DIR/web-dist-staging"
              tar -xzf /tmp/web-dist.tar.gz -C "$APP_DIR/web-dist-staging"
              rsync -a --delete "$APP_DIR/web-dist-staging/" "$APP_DIR/web-dist/"
              rm -rf "$APP_DIR/web-dist-staging" /tmp/web-dist.tar.gz
              echo "Frontend updated"
            fi

            # ── Nginx ──
            if [ "${NGINX_CHANGED}" = "true" ] && [ -f /tmp/nginx.conf ]; then
              echo "==> Updating nginx config..."
              cp /tmp/nginx.conf "$APP_DIR/nginx.conf"
              rm /tmp/nginx.conf
              docker restart brandshow-nginx
              echo "Nginx restarted"
            fi

            # ── 后端：本地 build ──
            if [ "${BACKEND_CHANGED}" = "true" ] && [ -f /tmp/backend-code.tar.gz ]; then
              echo "==> Updating backend code..."
              mkdir -p /tmp/brandshow-build
              tar -xzf /tmp/backend-code.tar.gz -C /tmp/brandshow-build
              rm /tmp/backend-code.tar.gz

              echo "==> Building backend image (local)..."
              docker build -t brandshow-backend:latest /tmp/brandshow-build/backend
              rm -rf /tmp/brandshow-build
              echo "Build complete"

              echo "==> Running migrations..."
              docker run --rm \
                --network newsfeed_default \
                -e DATABASE_URL="$(grep DATABASE_URL $APP_DIR/.env | cut -d= -f2-)" \
                -w /app \
                brandshow-backend:latest \
                alembic upgrade head

              echo "==> Restarting backend..."
              docker rm -f brandshow-backend 2>/dev/null || true
              docker run -d \
                --name brandshow-backend \
                --network newsfeed_default \
                --restart unless-stopped \
                -e DATABASE_URL="$(grep DATABASE_URL $APP_DIR/.env | cut -d= -f2-)" \
                -e ENVIRONMENT=production \
                -e CORS_ORIGINS="*" \
                brandshow-backend:latest
              docker network connect brandshow_net brandshow-backend 2>/dev/null || true
              docker image prune -f 2>/dev/null || true
            fi

            # ── 健康检查 ──
            echo "==> Healthcheck..."
            for i in $(seq 1 15); do
              code=$(curl -sf -o /dev/null -w "%{http_code}" --max-time 3 http://127.0.0.1:8090/health || echo "000")
              if [ "$code" = "200" ]; then
                echo "==> OK (attempt $i)"
                break
              fi
              [ "$i" = "15" ] && echo "ERROR: healthcheck failed" >&2 && exit 1
              sleep 2
            done
            echo "==> Deploy complete"
            REMOTE
