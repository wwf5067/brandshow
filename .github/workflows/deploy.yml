# 推 main 时自动部署到腾讯云 Lighthouse
#
# 优化方案：构建镜像后直接 scp 传到服务器，不走 GHCR（国内拉取慢）
#
# 流程:
#   1) 并行：构建前端静态产物 + 构建后端 Docker 镜像（tar.zst）
#   2) deploy：SSH 传输产物 → 服务器 docker load → alembic migrate → 重启容器
#
# 必需的 GitHub Secrets:
#   SSH_HOST / SSH_USER / SSH_PORT / SSH_KEY

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm run build
        working-directory: frontend

      - name: Pack frontend dist
        run: tar -czf web-dist.tar.gz -C frontend/dist .

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web-dist.tar.gz
          retention-days: 1

  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: backend/Dockerfile
          push: false
          tags: brandshow-backend:latest
          # runner 本地 cache，加速重复构建
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
          outputs: type=docker

      - name: Export & compress image
        run: |
          docker save brandshow-backend:latest | zstd -T0 -3 -o backend-image.tar.zst
          ls -lh backend-image.tar.zst

      - uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: backend-image.tar.zst
          retention-days: 1

  deploy:
    needs: [build-frontend, build-backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: web-dist

      - uses: actions/download-artifact@v4
        with:
          name: backend-image

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.SSH_PORT || 22 }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Upload artifacts to server
        run: |
          scp -P ${{ secrets.SSH_PORT || 22 }} \
            backend-image.tar.zst \
            web-dist.tar.gz \
            deploy/nginx.conf \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/

      - name: Deploy on server
        env:
          IMAGE_SHA: ${{ github.sha }}
        run: |
          ssh -tt \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -p ${{ secrets.SSH_PORT || 22 }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            'bash -s' << 'REMOTE'
            set -euo pipefail
            APP_DIR=/opt/brandshow

            echo "==> Loading backend image..."
            zstd -d /tmp/backend-image.tar.zst --stdout | docker load
            rm /tmp/backend-image.tar.zst

            echo "==> Updating frontend..."
            mkdir -p "$APP_DIR/web-dist-staging"
            rm -rf "$APP_DIR/web-dist-staging"/*
            tar -xzf /tmp/web-dist.tar.gz -C "$APP_DIR/web-dist-staging"
            rm /tmp/web-dist.tar.gz
            rsync -a --delete "$APP_DIR/web-dist-staging/" "$APP_DIR/web-dist/"
            rm -rf "$APP_DIR/web-dist-staging"

            echo "==> Updating nginx.conf..."
            OLD_HASH=$(sha256sum "$APP_DIR/nginx.conf" 2>/dev/null | cut -d' ' -f1 || echo "")
            cp /tmp/nginx.conf "$APP_DIR/nginx.conf"
            NEW_HASH=$(sha256sum "$APP_DIR/nginx.conf" | cut -d' ' -f1)

            echo "==> Running migrations..."
            docker run --rm \
              --network newsfeed_default \
              -e DATABASE_URL="$(grep DATABASE_URL $APP_DIR/.env | cut -d= -f2-)" \
              -w /app \
              brandshow-backend:latest \
              alembic upgrade head

            echo "==> Restarting backend..."
            docker rm -f brandshow-backend 2>/dev/null || true
            docker run -d \
              --name brandshow-backend \
              --network newsfeed_default \
              --restart unless-stopped \
              -e DATABASE_URL="$(grep DATABASE_URL $APP_DIR/.env | cut -d= -f2-)" \
              -e ENVIRONMENT=production \
              -e CORS_ORIGINS="*" \
              brandshow-backend:latest
            # 同时加入 brandshow_net 让 nginx 能访问
            docker network connect brandshow_net brandshow-backend 2>/dev/null || true

            if [ "$OLD_HASH" != "$NEW_HASH" ]; then
              echo "==> nginx.conf changed, restarting nginx..."
              docker restart brandshow-nginx
            fi

            # 清理旧镜像（保留最近 1 个）
            docker image prune -f --filter "label!=keep" 2>/dev/null || true

            echo "==> Healthcheck..."
            for i in $(seq 1 15); do
              code=$(curl -sf -o /dev/null -w "%{http_code}" --max-time 3 http://127.0.0.1:8090/health || echo "000")
              if [ "$code" = "200" ]; then
                echo "==> OK (attempt $i)"
                break
              fi
              [ "$i" = "15" ] && echo "ERROR: healthcheck failed" >&2 && exit 1
              sleep 2
            done
            echo "==> Deploy complete"
            REMOTE
