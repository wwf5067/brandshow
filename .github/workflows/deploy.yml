# 推 main 时自动部署到腾讯云 Lighthouse
#
# 加速优化：
#   - 检测前端/后端文件是否变化，没变化则跳过 build，直接复用上次产物
#   - 前端/后端并行构建
#   - GHA layer cache 加速 Docker build
#   - concurrency 取消旧的 run
#
# 必需的 GitHub Secrets:
#   SSH_HOST / SSH_USER / SSH_PORT / SSH_KEY

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  # ── 检测变化 ──────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'
              - 'deploy/nginx.conf'

  # ── 构建前端 ──────────────────────────────────────────────
  build-frontend:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 如果前端没有变化，尝试从 cache 恢复上次产物
      - name: Restore frontend cache
        id: fe-cache
        uses: actions/cache@v4
        with:
          path: web-dist.tar.gz
          key: frontend-dist-${{ hashFiles('frontend/src/**', 'frontend/package.json', 'frontend/vite.config.js') }}
          restore-keys: frontend-dist-

      - name: Build frontend
        if: needs.changes.outputs.frontend == 'true' || steps.fe-cache.outputs.cache-hit != 'true'
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..
          tar -czf web-dist.tar.gz -C frontend/dist .

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web-dist.tar.gz
          retention-days: 3

  # ── 构建后端 ──────────────────────────────────────────────
  build-backend:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: backend/Dockerfile
          push: false
          tags: brandshow-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
          outputs: type=docker

      - name: Export & compress image
        run: |
          docker save brandshow-backend:latest | zstd -T0 -3 -o backend-image.tar.zst
          ls -lh backend-image.tar.zst

      - uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: backend-image.tar.zst
          retention-days: 1

  # ── 部署 ──────────────────────────────────────────────────
  deploy:
    needs: [changes, build-frontend, build-backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: web-dist

      - uses: actions/download-artifact@v4
        with:
          name: backend-image

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.SSH_PORT || 22 }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Upload artifacts to server
        run: |
          scp -P ${{ secrets.SSH_PORT || 22 }} \
            backend-image.tar.zst \
            web-dist.tar.gz \
            deploy/nginx.conf \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/

      - name: Deploy on server
        env:
          BACKEND_CHANGED: ${{ needs.changes.outputs.backend }}
          FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend }}
        run: |
          ssh -tt \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -p ${{ secrets.SSH_PORT || 22 }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "BACKEND_CHANGED='${BACKEND_CHANGED}' FRONTEND_CHANGED='${FRONTEND_CHANGED}' bash -s" << 'REMOTE'
            set -euo pipefail
            APP_DIR=/opt/brandshow

            echo "==> Backend changed: ${BACKEND_CHANGED}, Frontend changed: ${FRONTEND_CHANGED}"

            # ── 更新前端 ──
            echo "==> Updating frontend..."
            mkdir -p "$APP_DIR/web-dist-staging"
            rm -rf "$APP_DIR/web-dist-staging"/*
            tar -xzf /tmp/web-dist.tar.gz -C "$APP_DIR/web-dist-staging"
            rm /tmp/web-dist.tar.gz
            rsync -a --delete "$APP_DIR/web-dist-staging/" "$APP_DIR/web-dist/"
            rm -rf "$APP_DIR/web-dist-staging"

            # ── 更新 nginx 配置 ──
            OLD_HASH=$(sha256sum "$APP_DIR/nginx.conf" 2>/dev/null | cut -d' ' -f1 || echo "")
            cp /tmp/nginx.conf "$APP_DIR/nginx.conf"
            NEW_HASH=$(sha256sum "$APP_DIR/nginx.conf" | cut -d' ' -f1)
            if [ "$OLD_HASH" != "$NEW_HASH" ]; then
              echo "==> nginx.conf changed, restarting nginx..."
              docker restart brandshow-nginx
            fi

            # ── 加载后端镜像 ──
            echo "==> Loading backend image..."
            zstd -d /tmp/backend-image.tar.zst --stdout | docker load
            rm /tmp/backend-image.tar.zst

            # ── 数据库迁移 ──
            echo "==> Running migrations..."
            docker run --rm \
              --network newsfeed_default \
              -e DATABASE_URL="$(grep DATABASE_URL $APP_DIR/.env | cut -d= -f2-)" \
              -w /app \
              brandshow-backend:latest \
              alembic upgrade head

            # ── 重启后端 ──
            echo "==> Restarting backend..."
            docker rm -f brandshow-backend 2>/dev/null || true
            docker run -d \
              --name brandshow-backend \
              --network newsfeed_default \
              --restart unless-stopped \
              -e DATABASE_URL="$(grep DATABASE_URL $APP_DIR/.env | cut -d= -f2-)" \
              -e ENVIRONMENT=production \
              -e CORS_ORIGINS="*" \
              brandshow-backend:latest
            docker network connect brandshow_net brandshow-backend 2>/dev/null || true

            # ── 清理旧镜像 ──
            docker image prune -f 2>/dev/null || true

            # ── 健康检查 ──
            echo "==> Healthcheck..."
            for i in $(seq 1 15); do
              code=$(curl -sf -o /dev/null -w "%{http_code}" --max-time 3 http://127.0.0.1:8090/health || echo "000")
              if [ "$code" = "200" ]; then
                echo "==> OK (attempt $i)"
                break
              fi
              [ "$i" = "15" ] && echo "ERROR: healthcheck failed" >&2 && exit 1
              sleep 2
            done
            echo "==> Deploy complete"
            REMOTE
