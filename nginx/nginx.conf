events {
    worker_connections 1024;
}

http {
    upstream backend {
        server backend:8000;
    }

    upstream frontend {
        server frontend:80;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 10m;

        # Logo 图片反向代理（绕过防盗链）
        location /img-proxy/ {
            proxy_pass https://img.chinapp.com/;
            proxy_set_header Referer "https://www.chinapp.com/";
            proxy_set_header Host img.chinapp.com;
            proxy_ssl_server_name on;
        }

        # API reverse proxy
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }

        # Frontend SPA
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
        }
    }
}
